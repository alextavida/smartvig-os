name: Build APK SmartVig OS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: Install npm dependencies
        working-directory: app-mobile
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393"

      - name: Generate Gradle Wrapper JAR
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.3-bin.zip -P /tmp
          unzip -q /tmp/gradle-8.3-bin.zip -d /opt
          /opt/gradle-8.3/bin/gradle wrapper \
            --gradle-version 8.3 \
            --distribution-type bin \
            --project-dir app-mobile/android

      - name: Set SDK path
        working-directory: app-mobile/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission to gradlew
        working-directory: app-mobile/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: app-mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVig-OS-v1.0-debug
          path: app-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
