name: Build APK SmartVig OS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: Install npm dependencies
        working-directory: app-mobile
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Setup Gradle 8.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.3'

      - name: Create local.properties
        working-directory: app-mobile/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create assets directory
        run: mkdir -p app-mobile/android/app/src/main/assets

      - name: Install PNG tools (optipng + ImageMagick)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq optipng imagemagick

      - name: Fix source PNG assets for AAPT2
        run: |
          find app-mobile/src/assets -name '*.png' -size 0 -delete 2>/dev/null || true
          find app-mobile/src/assets -name '*.png' | while read f; do
            # Tenta optipng primeiro (remove ICC profiles, interlacing)
            optipng -o2 -strip all -quiet "$f" 2>/dev/null || {
              # Fallback: ImageMagick força sRGB sem ICC
              convert "$f" -strip -type TrueColor -define png:exclude-chunk=iCCP PNG32:"$f" 2>/dev/null || true
            }
          done

      - name: Bundle JavaScript
        working-directory: app-mobile
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Fix generated PNG assets for AAPT2
        # React Native copia os assets após o bundle — reprocessa os gerados também
        run: |
          find app-mobile/android/app/src/main/res -name '*.png' | while read f; do
            optipng -o2 -strip all -quiet "$f" 2>/dev/null || {
              convert "$f" -strip -type TrueColor -define png:exclude-chunk=iCCP PNG32:"$f" 2>/dev/null || true
            }
          done

      - name: Build release APK
        working-directory: app-mobile/android
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVig-OS-v1.0-release
          path: app-mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
