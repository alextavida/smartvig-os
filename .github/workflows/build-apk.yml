name: Build APK SmartVig OS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: Install npm dependencies
        working-directory: app-mobile
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Setup Gradle 8.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.3'

      - name: Create local.properties
        working-directory: app-mobile/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create assets directory
        run: mkdir -p app-mobile/android/app/src/main/assets

      - name: Bundle JavaScript
        working-directory: app-mobile
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build release APK
        working-directory: app-mobile/android
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVig-OS-v1.0-release
          path: app-mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
